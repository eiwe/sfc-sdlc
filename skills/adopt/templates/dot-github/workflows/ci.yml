# Spec-First SDLC — CI (the test gate).
# Copied to .github/workflows/ci.yml on adoption. Replace the placeholder commands
# with this project's real ones (keep them in sync with AGENTS.md and TESTING.md).
name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main] # or master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate changelog format
        run: node scripts/check-changelog.mjs CHANGELOG.md

      # Add your runtime and dependency setup before this step.
      - name: Verify project
        run: |
          # SDLC_VERIFY_COMMAND_BEGIN
          echo "SDLC adoption incomplete: configure the real build/test/lint command."
          exit 1
          # SDLC_VERIFY_COMMAND_END

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Required for organization-owned repos (free for personal accounts).
          # Add the secret, then uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

